; ESP32-C3 Super Mini firmware. One env per device profile (include/config.h):
;   c3_supermini       PROFILE_POWER_BOARD      3 relays CH1=GPIO1 CH2=GPIO3 CH3=GPIO4 (COM -> NC) + schedules
;   c3_button_tester   PROFILE_BUTTON_TESTER    1 servo button GPIO0, manual press tests
;   c3_rice_button     PROFILE_SCHEDULED_BUTTON 1 servo button GPIO0 + press schedules

[platformio]
default_envs = c3_supermini

[env:c3_supermini]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
build_src_filter = +<*> -<servo/>

board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv

upload_port = /dev/tty.usbmodem1122201
monitor_port = /dev/tty.usbmodem1122201
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; Super Mini has no USB-UART bridge: Serial goes over native USB-Serial/JTAG
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    ; Relay module input polarity. 0 = active-LOW (typical opto modules), 1 = active-HIGH
    -DRELAY_ACTIVE_HIGH=0
    ; DEVICE_PROFILE unset = PROFILE_POWER_BOARD (include/config.h); child envs set it
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    nanopb/Nanopb@^0.4.91

; nanopb PlatformIO integration generates .pb.c/.pb.h at build time
custom_nanopb_protos =
    +<proto/power_board.proto>
custom_nanopb_options =
    --error-on-unmatched

; Flic / smart-button tester: servo presses the button on command from the app.
[env:c3_button_tester]
extends = env:c3_supermini
build_flags =
    ${env:c3_supermini.build_flags}
    -DDEVICE_PROFILE=2

; Scheduled button (rice cooker start): servo press at a time of day.
[env:c3_rice_button]
extends = env:c3_supermini
build_flags =
    ${env:c3_supermini.build_flags}
    -DDEVICE_PROFILE=3

; Bench test: toggle one relay channel every 5 s. pio run -e c3_toggle_test -t upload
[env:c3_toggle_test]
extends = env:c3_supermini
build_flags =
    ${env:c3_supermini.build_flags}
    -DRELAY_TEST_CHANNEL=1
    -DRELAY_TEST_PERIOD_MS=5000

; Bench test: walk all channels, 2 s energised / 2 s released each. pio run -e c3_all_test -t upload
[env:c3_all_test]
extends = env:c3_supermini
build_flags =
    ${env:c3_supermini.build_flags}
    -DRELAY_TEST_ALL
    -DRELAY_TEST_PERIOD_MS=2000

; ESP32-C3 Super Mini driving an SG90 servo as a rack-and-pinion push/pull handle.
; Standalone app in src/servo/. Signal GPIO0, servo powered from 5V. pio run -e c3_servo -t upload
; Serial: "1" single click, "2" double click, "3" press-and-hold 6 s, "s" stop,
; "go 2.4" absolute cm, "+0.2"/"push 0.2", "-0.5"/"pull 0.5", "?".
[env:c3_servo]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
build_src_filter = +<servo/>
board_build.flash_mode = dio
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; Super Mini has no USB-UART bridge: Serial goes over native USB-Serial/JTAG
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DSERVO_PIN=0
    ; 20 T pinion, module 1.273 (docs/cad/button_pusher.py): 4 cm rack travel over 180 deg
    ; radius = stroke / pi = 40 / 3.1416 = 12.73 mm
    -DPINION_RADIUS_MM=12.73f
    -DSTROKE_MM=40.0f

; Same board, handle runs 0..stroke..0 on its own. pio run -e c3_servo_sweep -t upload
[env:c3_servo_sweep]
extends = env:c3_servo
build_flags =
    ${env:c3_servo.build_flags}
    -DSERVO_SWEEP
